<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>킥챌린저 설치</title>
<style>body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#14213d;color:#f4f4f2;display:flex;min-height:100vh;align-items:center;justify-content:center}
main{max-width:420px;padding:32px 20px;text-align:center}h1{font-size:28px;margin:0 0 6px}p{color:#a9b3c6;line-height:1.5}
a.btn{display:block;background:#fca311;color:#14213d;text-decoration:none;font-size:20px;font-weight:700;padding:18px;border-radius:16px;margin:24px 0 12px}
small{color:#a9b3c6}ol{text-align:left;color:#a9b3c6;line-height:1.7;padding-left:20px}</style></head><body><main>
<h1>킥챌린저</h1><p>발차기 횟수·높이 측정 (개발판) · Android</p>
<a class="btn" href="kick-challenger-latest.apk" download>APK 내려받기</a>
<small id="v"></small>
<ol><li>내려받은 파일을 열고 <b>설치</b></li><li>"알 수 없는 앱 설치"를 허용하라고 하면 허용</li><li>"Play 프로텍트 · 앱 차단됨"이 뜨면 「확인」 대신 그 위의 <b>「무시하고 설치하기」</b>를 누릅니다(스토어 밖 앱에 뜨는 일반 경고입니다)</li></ol>
<p><small>Android 10 이상 · arm64 기기 · 영상은 기기 밖으로 나가지 않습니다</small></p>
<script>fetch('latest.json?'+Date.now()).then(r=>r.json()).then(j=>{document.getElementById('v').textContent='버전 '+j.versionName+' · '+j.publishedAt.slice(0,10)}).catch(()=>{})</script>
</main></body></html>
